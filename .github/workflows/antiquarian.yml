# Antiquarian's own broadsheet workflow — dogfoods the composite action.
#
# The render/comment/publish logic lives in the repo-root action.yml (the
# Marketplace-packaged Action, #89). This workflow is just the trigger wiring
# plus `local-install: true` so it renders with the code under test rather than
# a published release.
#
# Does NOT regenerate stories or run survey — those need `claude -p`, which
# requires an interactive session. Run `antiquarian survey` locally, commit
# .antiquarian/, and this action renders from that data.

name: Antiquarian

on:
  push:
    branches: [main]
    paths:
      - '.antiquarian/**'
      - 'antiquarian/render*.py'
  pull_request:
    paths:
      - '.antiquarian/**'
      - 'antiquarian/render*.py'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Render broadsheet
        uses: ./
        with:
          local-install: "true"
