name: Claude Code Review

# Structural code-review gate (#164). Fires on every PR regardless of who opened
# it, so review no longer depends on an agent remembering to run it by hand. An
# independent reviewer (not the PR author) reads the diff and posts inline
# findings — preserving the independence the retro found catches bug classes
# that same-agent self-review misses.

# Steady-state burn reduction, ported from sandy (#320 §5):
#   - Auto-trigger on `opened` only. With `synchronize` a 10-commit PR fired TEN
#     model reviews; now it fires one. Re-review on demand by commenting `/review`
#     (or `@claude review`), which is why the issue_comment trigger below exists —
#     dropping `synchronize` without it would remove the ability to re-review
#     after pushing fixes.
#   - Skip Dependabot PRs and `chore` titles entirely; neither benefits from a
#     model review, and both are frequent.
# This account has exhausted its included Actions minutes two months running, and
# only PRIVATE repos (this one) bill against that allowance.
on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-antiquarian-${{ github.event.pull_request.number || github.event.issue.number }}
  # MUST stay false. Cancellation happens when a run is *created*, before
  # job-level `if` filtering — so with `true`, ANY comment on the PR (including
  # this workflow's own tracking comment from track_progress) spawns an
  # issue_comment run in this group and cancels the in-flight review. canvasoptimizer
  # had 10 reviews cancelled mid-flight that way, billing partial minutes and
  # posting nothing. Queueing is always correct here.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  # claude-code-action mints its GitHub App token by exchanging a GitHub OIDC
  # token, so the job needs id-token: write even though we pass an OAuth token
  # for Claude itself. Without it the action fails: "Could not fetch an OIDC
  # token. Did you remember to add id-token: write to your workflow
  # permissions?"
  id-token: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Run when:
    #   - a non-fork PR is opened by a non-Dependabot author with a non-`chore`
    #     title, OR
    #   - a comment on a PR explicitly asks for `/review` or `@claude review`.
    #
    # The fork check stays on the pull_request branch only. `head.repo.fork` is
    # null on an issue_comment event, so a single top-level `== false` check would
    # evaluate false and skip every on-demand review. Fork safety still holds on
    # that path: the action independently verifies the commenting actor has write
    # access before doing anything.
    if: |
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.fork == false
        && github.event.pull_request.user.login != 'dependabot[bot]'
        && !startsWith(github.event.pull_request.title, 'chore'))
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && (contains(github.event.comment.body, '/review')
            || contains(github.event.comment.body, '@claude review')))
    steps:
      # Gate on the secret so this workflow is a clean green no-op until the
      # CLAUDE_CODE_OAUTH_TOKEN secret is added — no red X on every PR meanwhile.
      - name: Check reviewer token is configured
        id: gate
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN not set — review skipped. Add the secret to enable the gate (#164)."
          fi

      # An issue_comment event carries no pull_request context, so a bare checkout
      # would review the DEFAULT BRANCH rather than the PR — silently reviewing the
      # wrong code. Resolve the head SHA explicitly on that path.
      - name: Resolve PR head SHA
        id: pr
        if: steps.gate.outputs.ready == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            number="${{ github.event.issue.number }}"
            sha="$(gh api "repos/${{ github.repository }}/pulls/${number}" --jq .head.sha)"
          else
            sha="${{ github.event.pull_request.head.sha }}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.ready == 'yes'
        # Pinned to a full SHA, not the mutable @v4 tag: a re-pointed tag would run
        # new code in CI with this job's permissions and secrets. = v4.4.0.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          ref: ${{ steps.pr.outputs.sha }}

      - if: steps.gate.outputs.ready == 'yes'
        # Pinned for the same supply-chain reason. = v1.0.183, matching sandy.
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b # v1.0.183
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # This gate exists to review AGENT PRs (#164), and agents open PRs
          # under bot identities (e.g. metaframework-dispatch-bot). The action
          # blocks non-human actors by default ("Workflow initiated by
          # non-human actor … Add bot to allowed_bots"), which would make the
          # gate a no-op for exactly the PRs it's meant to catch. Allow all
          # bots: safe here because fork PRs are already skipped above, so only
          # branches pushed to this private repo (Tom + trusted Dispatch bots)
          # can trigger it. Narrow to specific logins if that ever changes.
          allowed_bots: "*"
          # track_progress is what actually REGISTERS the inline-comment MCP
          # server (and a live tracking comment). Without it the server never
          # connects, so mcp__github_inline_comment__create_inline_comment is
          # denied even though it's in --allowedTools — --allowedTools only
          # FILTERS already-registered servers, it does not register them. That
          # was the "14 denials, posted nothing, max-turns" failure.
          track_progress: true
          # CORRECTION to the previous note here, which said upstream's example
          # omits classify_inline_comments so we should let it default. The
          # DEFAULT IS TRUE — verified in a live run's resolved inputs on sandy,
          # where `classify_inline_comments: true` appeared with no such key in the
          # workflow. So "let it default" left the buggy buffering path enabled;
          # omitting it is not the same as disabling it. Pinned off explicitly,
          # which also stops an upstream default change from reintroducing it.
          classify_inline_comments: false
          # --allowedTools then ALLOWS the now-registered inline-comment tool.
          # gh pr diff/view give full-diff context; gh pr comment is the channel
          # for a "diff is clean" summary when there are no line-level findings.
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
            --max-turns 25
          prompt: |
            You are an independent reviewer of this pull request — you did NOT
            write the diff. Review it for real defects a careful reviewer would
            catch in one sitting. Read the enclosing function of each hunk, not
            just the changed lines.

            Prioritise, in order:
            1. Correctness bugs: inverted conditions, off-by-one, null/None on a
               reachable path, missing await, wrong-variable copy-paste, errors
               swallowed, unescaped user text reaching HTML/SVG (XSS).
            2. Silent-drop / silent-truncation bugs — this codebase has been
               bitten repeatedly: data assigned with `=` where it should append
               (slug collisions), an item filtered out of a group without a
               "shown vs total" count, an unconditional write that clobbers good
               data. Treat any place where records can vanish without a log as
               suspect.
            3. Removed-behavior regressions: for deleted/replaced lines, name the
               invariant they enforced and confirm it's re-established.
            4. Convention violations from the repo's CLAUDE.md files: the voice
               rules (no "blame/fault/should have" in narrative, commits, or PR
               bodies), back-end-over-front-end (no hidden form fields), small
               composable functions (~30-line split signal), cache keyed by
               (commit_sha, file_path) needing migrations, and the arc-tier gate
               (docs/arc-tier-and-density.md) for any arc/Act/density change.

            Post each finding as an inline comment on the exact line using the
            mcp__github_inline_comment__create_inline_comment tool, with a
            concrete failure scenario (inputs/state -> wrong output). Do not
            invent issues to have something to say; if the diff is clean, post
            one brief top-level `gh pr comment` saying so. Skip pure style nits
            with no observable effect.
