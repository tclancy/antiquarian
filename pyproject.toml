[project]
name = "antiquarian"
version = "0.1.0"
description = "Reconstruct code history narratives from git — Telephone in reverse."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydriller>=2.9",
    "typer>=0.12",
    "python-ulid>=2.0",
    "typing-extensions>=4.15.0",
    "markdown>=3.10.2",
]

[project.optional-dependencies]
# Optional AI backends (#91, #102). The default claude-p backend needs none.
# Install the one you want: `pip install antiquarian[anthropic]` etc.
anthropic = ["anthropic>=0.40"]
ollama = ["ollama>=0.4"]
exo = ["openai>=1.0"]
all = ["anthropic>=0.40", "ollama>=0.4", "openai>=1.0"]

[project.scripts]
antiquarian = "antiquarian.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.152.6",
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.12",
    "z3-solver>=4.13.0",
]
