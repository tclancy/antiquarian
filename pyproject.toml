[project]
name = "antiquarian"
version = "0.1.0"
description = "Reconstruct code history narratives from git — Telephone in reverse."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydriller>=2.9",
    "typer>=0.12",
    "python-ulid>=2.0",
    "typing-extensions>=4.15.0",
]

[project.scripts]
antiquarian = "antiquarian.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
