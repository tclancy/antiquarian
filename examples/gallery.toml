# Sample Antiquarian gallery manifest (issue #92, Option B / #86).
#
# `antiquarian gallery build --manifest gallery.toml --output gallery/`
# assembles the broadsheets named below into a self-contained GitHub Pages
# site: one card per repo on an illuminated landing page, each linking to
# that repo's broadsheet, plus a "want one for your repo?" call-to-action.
#
# `render_dir` is resolved RELATIVE TO THIS FILE and must already contain a
# rendered broadsheet (an `index.html` produced by `antiquarian render`).
# Populating those dirs is the job of `antiquarian gallery generate` (#93);
# this assembler only composes what already exists.

[gallery]
title = "The Antiquarian Gallery"
subtitle = "Illuminated histories of notable open-source codebases"
action_url = "https://github.com/tclancy/antiquarian"

[[repos]]
slug = "requests"
name = "requests"
tagline = "HTTP for humans."
github_url = "https://github.com/psf/requests"
render_dir = "renders/requests"

[[repos]]
slug = "flask"
name = "Flask"
tagline = "A micro web framework, gracefully aged."
github_url = "https://github.com/pallets/flask"
render_dir = "renders/flask"

[[repos]]
slug = "click"
name = "Click"
tagline = "Composable command-line interfaces."
github_url = "https://github.com/pallets/click"
render_dir = "renders/click"
