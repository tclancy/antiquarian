# Antiquarian GitHub Actions workflow — copy to your repo.
#
# Copy this to `.github/workflows/antiquarian.yml` in your own repo. It calls
# the Marketplace-packaged Antiquarian Action, which:
#
#   - On push to your default branch: renders the broadsheet from committed
#     `.antiquarian/` data and publishes it to GitHub Pages.
#   - On PR: renders, uploads the broadsheet as an artifact, and comments a
#     download link.
#
# DOES NOT regenerate stories or run survey. Story synthesis goes through
# `claude -p`, which needs an interactive session. Run `antiquarian survey`
# locally, commit `.antiquarian/`, and this action renders from that data.
#
# Setup:
#   1. Run `antiquarian survey` locally in your repo.
#   2. Commit .antiquarian/ (cache.db, stories/, surveys/).
#   3. Drop this file at .github/workflows/antiquarian.yml.
#   4. After the first push to your default branch, visit Settings → Pages and
#      configure: "Deploy from a branch" → gh-pages → root.
#
# What you're opting into:
#   - The rendered broadsheet (incl. per-file story HTML) goes to the open
#     internet via GitHub Pages on every push to your default branch.
#   - Commit messages, author emails, and PR bodies that the stories reference
#     are part of that. No redaction is applied.

name: Antiquarian

on:
  push:
    branches: [main]
    paths:
      - '.antiquarian/**'
  pull_request:
    paths:
      - '.antiquarian/**'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Pin a release tag (@v1) in production; @main is for beta testers.
      - uses: tclancy/antiquarian@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
